; スマホ版 (2026-11-18): Vulkan on every phone that has it. The engine's own profiles turn Vulkan off for any GPU they do not
; list (Mali-G615, Mali-G57, ...), and once OpenGL ES 3.1 was packaged too (for phones without Vulkan) those phones started
; on OpenGL instead: noise over the screen and a crash in the GPU driver at start. OpenGL is kept for phones without Vulkan.
[Android DeviceProfile]
-CVars=r.Android.DisableVulkanSupport=1
+CVars=r.Android.DisableVulkanSupport=0
