[ChaosImpact.Online]
; Internet play for password rooms: the relay server's address and directory port (Tools/OnlineRelay).
; Empty: rooms are found on the LAN as before. One PC can set its own in GameUserSettings.ini, or use -CIRelay=.
; Oracle Cloud (Japan East, Tokyo), VM ci-relay, ephemeral public IP (it changes if the VM is made again).
; -CILan on the command line still forces the LAN.
RelayServer=132.145.120.172:7700
; Auto: try UDP, then use verified TLS WebSocket connections when UDP is unavailable.
RelayWebSocketServer="wss://132-145-120-172.sslip.io"
RelayTransport=auto
; The relay's one-port UDP entry (its directory and every room), for a line that lets only well-known ports out (a
; school's or a shop's Wi-Fi): UDP 443, redirected on the VM to the relay's --mux-port. Tried alongside the relay's own
; port until one answers; only when neither does, the WebSocket (TCP). 0: none.
RelayMuxPort=443

[/Script/Engine.GameNetworkManager]
; Movement is each player's own (the host trusts it): the host must not move a player by itself when their updates
; are a moment late (it made guests fall through the ground on the host and be pulled back). 0 turns that off.
MAXCLIENTUPDATEINTERVAL=0
; How often a guest sends its movement: with every packet (60 a second at most, IpNetDriver MaxNetTickRate), so it
; is never held back waiting; the packets go anyway (each side answers the other's). Standing still, less often; a
; line the line guard has slowed right down (net speed this low), a little less often.
ClientNetSendMoveDeltaTime=0.0166
ClientNetSendMoveDeltaTimeThrottled=0.0333
ClientNetSendMoveDeltaTimeStationary=0.0333
ClientNetSendMoveThrottleAtNetSpeed=12000
