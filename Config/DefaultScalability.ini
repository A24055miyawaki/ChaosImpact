; ChaosImpact: smoke and the other soft effects (after depth of field translucency) drawn at a lower resolution.
; A smoke ball's cloud filling the view is lit translucent sprites over the whole screen several layers deep: at half
; resolution it costs about a quarter (measured 2026-11-13: one cloud 22 -> 12 ms, three clouds 77 -> 20 ms GPU).
; The clouds are soft, so it does not show (最高 included: at 70% three clouds still cost 31 ms). Full resolution only at Cine.
[EffectsQuality@0]
r.SeparateTranslucencyScreenPercentage=50

[EffectsQuality@1]
r.SeparateTranslucencyScreenPercentage=50

[EffectsQuality@2]
r.SeparateTranslucencyScreenPercentage=50

[EffectsQuality@3]
r.SeparateTranslucencyScreenPercentage=50

[EffectsQuality@Cine]
r.SeparateTranslucencyScreenPercentage=100
